name: Desktop CI and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows
            artifact: universal-converter-windows-x64
          - runner: ubuntu-22.04
            target: linux
            artifact: universal-converter-linux-x64
          - runner: macos-15
            target: macos
            artifact: universal-converter-macos-arm64
          - runner: macos-15-intel
            target: macos
            artifact: universal-converter-macos-x64

    env:
      PYTHONUTF8: '1'
      FLUTTER_VERSION: 3.38.9

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-build.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-build.txt

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Python tests
        run: python -m pytest backend/tests -q

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build frozen Python worker
        run: python tool/build_worker.py release

      - name: Build Flutter desktop application
        run: flutter build ${{ matrix.target }} --release

      - name: Download AppImage packaging tool
        if: matrix.target == 'linux'
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Create distribution packages
        run: python tool/package_release.py

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
